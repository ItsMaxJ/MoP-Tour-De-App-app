# Generated by TdA template generator — run: docker compose up
# network_mode: host mirrors Tour de Cloud, where all containers share one pod's
# localhost. Host ports 3000, 3001 and 3306 must be free.
# Dev only: no Caddy. Frontend at http://localhost:3000, API at http://localhost:3001/api.
name: tda-app

services:
  web:
    image: node:22
    working_dir: /app
    command: sh -c "npx --yes serve@14 -l tcp://0.0.0.0:3000"
    volumes:
      - ./frontend:/app
    env_file: ./frontend/.env
    network_mode: host

  server:
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install -r requirements.txt && flask --app run:app run --debug --host 0.0.0.0 --port 3001"
    volumes:
      - ./backend:/app
      - server-pip-cache:/root/.cache/pip
    env_file: ./backend/.env
    network_mode: host
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    network_mode: host
    environment:
      MYSQL_DATABASE: product
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - ./backend/docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  server-pip-cache:
